name: Swarm Google
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min — slower because Google is hostile
  workflow_dispatch: {}
jobs:
  scrape:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: swarm-google-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: deps
        run: pip install -q -r requirements.txt
      - name: run
        env:
          MASTER_URL: https://elevatehomeprogram.com
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
          PROVIDER: gha-google
          SOURCE: google
          STAGE: search
          MAX_JOBS: '4'
          SHARD: ${{ matrix.shard }}
        run: python swarm_runner.py
