name: Swarm DDG
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 min (GitHub may delay; that's fine)
  workflow_dispatch: {}
jobs:
  scrape:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: swarm-ddg-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: deps
        run: pip install -q -r requirements.txt
      - name: run
        env:
          MASTER_URL: https://elevatehomeprogram.com
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
          PROVIDER: gha-ddg
          SOURCE: ddg
          STAGE: search
          MAX_JOBS: '6'
          SHARD: ${{ matrix.shard }}
        run: python swarm_runner.py
