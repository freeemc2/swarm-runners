name: Swarm Fetch
on:
  schedule:
    - cron: '*/7 * * * *'    # every 7 min — fetch backlog needs throughput
  workflow_dispatch: {}
jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: swarm-fetch-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: deps
        run: pip install -q -r requirements.txt
      - name: run
        env:
          MASTER_URL: https://elevatehomeprogram.com
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
          PROVIDER: gha-fetch
          SOURCE: web
          STAGE: fetch
          MAX_JOBS: '8'
          SHARD: ${{ matrix.shard }}
        run: python swarm_runner.py
