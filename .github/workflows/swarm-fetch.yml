name: Swarm Fetch
on:
  schedule:
    - cron: '*/7 * * * *'    # every 7 min — fetch backlog needs throughput
  workflow_dispatch: {}
concurrency:
  group: swarm-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: deps
        run: pip install -q -r requirements.txt
      - name: run
        env:
          MASTER_URL: https://elevatehomeprogram.com
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
          PROVIDER: gha-fetch
          SOURCE: web
          STAGE: fetch
          MAX_JOBS: '5'
        run: python swarm_runner.py
